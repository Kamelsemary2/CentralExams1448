<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17407a">
<title>منصة التهيئة للاختبارات المركزية – الصف الثالث المتوسط</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f9;--sf:#fff;--s2:#f4f7fb;--ink:#10264a;--mu:#566985;--ln:#d6dfec;--br:#17407a;--on:#fff;--tl:#0f8f8f;--ok:#17803f;--okb:#e4f5ea;--no:#c23636;--nob:#fbe9e9}
@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--sf:#122039;--s2:#17294a;--ink:#e8eefb;--mu:#9db0cf;--ln:#26395e;--br:#7db0ff;--on:#0a1424;--tl:#3cc4c4;--ok:#52d58a;--okb:#12331f;--no:#ff8080;--nob:#3a1a1a}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 17px/1.7 Cairo,Tahoma,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
#app{max-width:820px;margin:0 auto}
h1,h2{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
.hero{background:linear-gradient(135deg,#17407a,#0f8f8f);color:#fff;border-radius:24px;padding:28px 24px;margin-bottom:18px}
.hero h1{font-size:clamp(1.5rem,5vw,2.2rem)}
.hero p{margin:6px 0 0;opacity:.92}
.card{background:var(--sf);border:1.5px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:700;margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px}
.btn{border:0;background:var(--br);color:var(--on);border-radius:12px;padding:11px 22px;font-weight:700}
.btn.alt{background:var(--s2);color:var(--ink);border:1.5px solid var(--ln)}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--br);font-weight:700;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.subj{text-align:start;background:var(--sf);border:1.5px solid var(--ln);border-top:8px solid var(--c);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.subj:hover:not([disabled]){border-color:var(--c)}
.subj[disabled]{opacity:.6;cursor:default}
.subj .g{font-size:2rem;font-weight:800;color:var(--c);line-height:1}
.subj small,.mu{color:var(--mu)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog{height:10px;background:var(--ln);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--br));transition:width .25s}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.q{font-size:1.2rem;font-weight:700;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:start;background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:10px 14px}
.opt b{flex:0 0 24px;color:var(--tl)}
.opt:hover:not([disabled]){border-color:var(--br)}
.opt.good{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--no);background:var(--nob)}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px}
.fb.ok{background:var(--okb);border:1.5px solid var(--ok)}
.fb.no{background:var(--nob);border:1.5px solid var(--no)}
.score{font-size:3rem;font-weight:800;color:var(--br);line-height:1.1}
.wrong{border-top:1px solid var(--ln);padding:10px 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;margin:0 3px;font-size:.92em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
sup{font-size:.7em;line-height:0}
.fig{display:block;width:100%;max-width:380px;margin:10px auto;color:var(--ink)}
.fig.sq{max-width:300px}
.sec{margin:22px 0 10px;font-size:1.15rem;color:var(--mu)}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--ln)}
select{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:6px 8px;max-width:100%}
.tb{border-collapse:collapse;margin:10px auto}.tb th,.tb td{border:1.5px solid var(--ln);padding:3px 12px;text-align:center}.tb th{background:var(--s2)}
.opt .fig{margin:0;max-width:200px}
.card[dir=ltr]{text-align:left}
.pas{background:var(--s2);border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:14px;line-height:1.9}
.shd{font-weight:800;color:var(--br);margin:0 0 10px}.shd span{color:var(--mu);font-weight:500}
.ta{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;resize:vertical}
.emo{font-size:4.2rem;text-align:center;line-height:1.3}
.pas.poem{text-align:center;line-height:2.2;font-size:1.1rem}
.ruq{font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;font-size:1.7rem;line-height:2;margin:8px 0;color:var(--br)}
.tw{overflow-x:auto;max-width:100%}
.tb u,.q u,.wrong u{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div id="app"></div>
<script src="config.js"></script>
<script src="math-data.js"></script>
<script src="eng-data.js"></script>
<script src="lugh-data.js"></script>
<script src="sci-data.js"></script>
<script src="app.js"></script></body></html>
