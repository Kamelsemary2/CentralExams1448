<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة الإدارة – منصة التهيئة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap">
<style>
:root{--bg:#eef3f9;--sf:#fff;--ink:#10264a;--mu:#566985;--ln:#d6dfec;--br:#17407a;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--sf:#122039;--ink:#e8eefb;--mu:#9db0cf;--ln:#26395e;--br:#7db0ff;--on:#0a1424}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 Cairo,Tahoma,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
main{max-width:1000px;margin:0 auto}
h1,h2{margin:0 0 10px}
.card{background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
input{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%;max-width:340px;display:block;margin:6px 0 10px}
button{font:inherit;border:0;background:var(--br);color:var(--on);border-radius:10px;padding:9px 18px;font-weight:700;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stats div{background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:12px 16px}
.stats b{display:block;font-size:1.8rem;color:var(--br);line-height:1.2}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:700}
.mu{color:var(--mu)}
#err{color:#c23636;font-weight:700}
</style></head>
<body><main id="m"></main>
<script src="config.js"></script>
<script src="math-data.js"></script>
<script src="eng-data.js"></script>
<script src="lugh-data.js"></script>
<script src="sci-data.js"></script>
<script>
const M=document.getElementById("m");let tok=null,rows=[];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=t=>new Date(t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"});
function loginView(msg){
  M.innerHTML=`<h1>لوحة الإدارة</h1><form class="card" onsubmit="return go(event)">
  <label>البريد الإلكتروني<input id="em" type="email" required autocomplete="username"></label>
  <label>كلمة المرور<input id="pw" type="password" required autocomplete="current-password"></label>
  <p id="err">${esc(msg||"")}</p><button type="submit">دخول</button></form>`;
}
async function go(e){
  e.preventDefault();
  if(!CFG.url||!CFG.key)return loginView("املأ بيانات Supabase في ملف config.js أولًا."),false;
  try{
    const r=await fetch(CFG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("em").value,password:document.getElementById("pw").value})});
    const j=await r.json();if(!j.access_token)throw new Error("بيانات الدخول غير صحيحة.");
    tok=j.access_token;await load();
  }catch(x){loginView(x.message)}
  return false;
}
async function load(){
  rows=[];
  for(let p=0;p<40;p++){
    const r=await fetch(CFG.url+"/rest/v1/events?select=*&order=created_at.desc",{headers:{apikey:CFG.key,Authorization:"Bearer "+tok,Range:(p*1000)+"-"+(p*1000+999)}});
    const j=await r.json();if(!Array.isArray(j))throw new Error(j.message||"تعذّر تحميل البيانات.");
    rows=rows.concat(j);if(j.length<1000)break;
  }
  view();
}
function stats(){
  const St={},Qs={};
  rows.forEach(r=>{
    const s=St[r.student_id]||(St[r.student_id]={name:r.student_name,cls:r.class_name,last:r.created_at,fin:0,sum:0,ans:0,ok:0});
    if(r.created_at>s.last)s.last=r.created_at;
    if(r.kind==="finish"&&r.data&&r.data.total){s.fin++;s.sum+=r.data.score/r.data.total}
    if(r.kind==="answer"&&r.data){s.ans++;if(r.data.ok)s.ok++;
      const k=r.subject+"|"+r.chapter+"|"+r.data.q,q=Qs[k]||(Qs[k]={t:0,ok:0,sub:r.subject,ch:r.chapter,id:r.data.q});q.t++;if(r.data.ok)q.ok++}
  });
  return {St:Object.values(St),Qs:Object.values(Qs)};
}
function qText(q){
  try{const c=DATA[q.sub].chapters.find(c=>c.id===q.ch);return c.items.find(i=>i.id===q.id).q.replace(/⟦([^|⟧]*)\|([^⟧]*)⟧/g,"($1)/($2)").replace(/\^\{?([^\s}]+)\}?/g,"^$1")}catch(e){return q.sub+" / "+q.ch+" / "+q.id}
}
function view(filter){
  const {St,Qs}=stats(),f=(filter||"").trim(),day=Date.now()-864e5;
  const list=St.filter(s=>!f||(s.name+" "+s.cls).includes(f)).sort((a,b)=>b.last.localeCompare(a.last));
  const today=St.filter(s=>new Date(s.last).getTime()>day).length;
  const fin=St.reduce((a,s)=>a+s.fin,0),avg=fin?Math.round(St.reduce((a,s)=>a+s.sum,0)/fin*100):0;
  const weak=Qs.filter(q=>q.t>=3).sort((a,b)=>a.ok/a.t-b.ok/b.t).slice(0,12);
  M.innerHTML=`<h1>لوحة الإدارة</h1>
  <div class="stats"><div><b>${St.length}</b>طالبًا دخلوا</div><div><b>${today}</b>نشطوا آخر ٢٤ ساعة</div><div><b>${fin}</b>اختبارًا مكتملًا</div><div><b>${avg}٪</b>متوسط النتائج</div></div>
  <div class="card"><h2>الطلاب</h2><input id="f" placeholder="ابحث بالاسم أو الفصل" value="${esc(f)}" oninput="view(this.value);document.getElementById('f').focus()">
  <div class="scroll"><table><tr><th>الاسم</th><th>الفصل</th><th>آخر نشاط</th><th>اختبارات</th><th>متوسط الاختبارات</th><th>دقة الإجابات</th></tr>`+
  list.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.cls)}</td><td>${fd(s.last)}</td><td>${s.fin}</td><td>${s.fin?Math.round(s.sum/s.fin*100)+"٪":"—"}</td><td>${s.ans?Math.round(s.ok/s.ans*100)+"٪":"—"}</td></tr>`).join("")+
  `</table></div><p><button onclick="csv()">تصدير Excel (CSV)</button></p></div>
  <div class="card"><h2>أكثر الأسئلة خطأً</h2>`+(weak.length?`<div class="scroll"><table><tr><th>السؤال</th><th>المحاولات</th><th>نسبة الصواب</th></tr>`+
  weak.map(q=>`<tr><td>${esc(qText(q))}</td><td>${q.t}</td><td>${Math.round(q.ok/q.t*100)}٪</td></tr>`).join("")+`</table></div>`:`<p class="mu">تظهر هنا الأسئلة بعد ٣ محاولات على الأقل.</p>`)+`</div>`;
}
function csv(){
  const {St}=stats(),h=["الاسم","الفصل","آخر نشاط","اختبارات","متوسط الاختبارات %","دقة الإجابات %"];
  const l=St.map(s=>[s.name,s.cls,s.last,s.fin,s.fin?Math.round(s.sum/s.fin*100):"",s.ans?Math.round(s.ok/s.ans*100):""].map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[h.join(",")].concat(l).join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="students.csv";a.click();
}
loginView();
</script></body></html>
